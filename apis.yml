aid: clockster
name: Clockster
description: Clockster is a frontline staff-management super-app for food & beverage and
  retail businesses, consolidating attendance and time tracking, shift scheduling, automated
  payroll, earned wage access, business communication, tasks and checklists into a single
  mobile-first platform. Founded in 2018 and headquartered in Singapore with offices across
  Kazakhstan and Indonesia, Clockster serves more than 1,300 SMEs across Central and Southeast
  Asia — including brands such as KFC, Hardee's and Costa Coffee — and is backed by 500 Global,
  I2BF Global Ventures and Quest Ventures. It is delivered as iOS, Android and Huawei mobile
  apps plus a web console and currently exposes no public developer API surface.
